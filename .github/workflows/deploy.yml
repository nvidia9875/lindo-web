# 公開サイトのビルド & GitHub Pages への配信。
#
# 生成物は人がコミットしない。ここで組み立てて、そのまま配信する。
#
# 【配信するものは dist/ に明示的に集める】
# 以前は path: . でリポジトリ全体を配信していたため、内部ドキュメント
# （MTG-HANDOVER.md / TODO.md / CLAUDE.md）や旧デモ（concepts/ works/）まで
# 公開されていた。DNSレコード表や検証トークンが載っているので、
# scripts/build-site.sh で「出すものだけ」を選ぶ方式に変えてある。
#
# データ源は render.php 側の判定に従う:
#   Secret MICROCMS_API_KEY あり → microCMS から取得（現行・本命）
#   なし                        → リポジトリ内の works-img/ をローカル走査（退避用）
#
# ★microCMS が正。サイトには「CMSに入っているものだけ」が出る。投入が進むにつれて
#   増えていく前提で、途中段階でも本番に出して構わない（合意済み）。
name: Build & Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch: # 手動実行（切替の確認用）
  repository_dispatch:
    # microCMS の Webhook から叩ける口（コンテンツ公開 → 即反映）。
    # ただし Fine-grained PAT の権限が保存できず未使用。口だけ残してある。
    types: [microcms-update]
  schedule:
    # 定期ビルド。**これが実質の自動反映**。
    #
    # microCMS の Webhook は GitHub の dispatch API を叩くのに Authorization
    # ヘッダーが要る（microCMS のカスタム通知は X- 始まりのヘッダーしか送れないため、
    # 専用の「GitHub Actions」通知を使う必要がある）。そこに PAT を登録したが、
    # トークン側に権限が保存されない事象が解消できなかった。
    #
    # 先方が「公開」を押してから最大10分で反映される。Webhook が直れば即時になるので、
    # そのときはこの schedule を消してよい。
    - cron: '*/10 * * * *'

# 同時実行を1本に絞る。連続publishで古いビルドが後勝ちするのを防ぐ。
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none

      - name: Build dist/
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_SERVICE_ID: ${{ vars.MICROCMS_SERVICE_ID }}
          # データ源の切替スイッチ。`local` にすると microCMS を見ずに
          # リポジトリ内の works-img/ でビルドする。
          #
          # microCMS への全組投入が終わるまでの暫定表示に使う。Secret を削除して
          # 切り替える手もあるが、鍵を捨てると戻すのにmicroCMS側で再発行が要る。
          # 変数1つで往復できる形にしておく。
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          # お問い合わせフォーム（Web3Forms）。設定するとフォームが出る。
          # 未設定ならメール導線が出る＝「押しても届かないフォーム」にはならない。
          # キーは生成HTMLに出るので秘密ではない。Secret ではなく Variable でよい。
          WEB3FORMS_ACCESS_KEY: ${{ vars.WEB3FORMS_ACCESS_KEY }}
        # build-site.sh が生成・コピー・検査までやる（ローカルと同じ手順）。
        # データ取得に失敗すると render.php が例外を投げてここで落ちるので、
        # 事故ったサイトが本番に出ることはない。
        run: |
          if [ "$DATA_SOURCE" = "local" ]; then
            # 鍵は消さずに、このビルドでだけ見えなくする。
            unset MICROCMS_API_KEY
            echo "データ源: ローカル works-img/（DATA_SOURCE=local）"
          elif [ -n "$MICROCMS_API_KEY" ]; then
            echo "データ源: microCMS"
          else
            echo "データ源: ローカル works-img/（Secret 未登録）"
          fi
          ./scripts/build-site.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # ここに入れたものだけが公開される。
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
